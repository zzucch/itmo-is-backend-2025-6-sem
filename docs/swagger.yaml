host: localhost:3000
info:
  contact: {}
  title: Phone Marketplace API
  version: "1.0"
paths:
  /:
    get:
      description: Renders home page
      produces:
      - text/html
      responses:
        "200":
          description: HTML home page
        "500":
          description: Internal server error
      summary: Renders home page
      tags:
      - pages
  /api/catalogs:
    get:
      description: Retrieves all catalogs for admin or user's own catalogs.
      produces:
      - application/json
      responses:
        "200":
          description: List of catalogs
          schema:
            items:
              $ref: '#/definitions/internal_domain_catalog.Catalog'
            type: array
        "500":
          description: Could not fetch catalogs
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: get all catalogs
      tags:
      - catalogs
    post:
      consumes:
      - application/json
      description: Creates a new catalog entry for the logged-in user.
      parameters:
      - description: Catalog object to be created
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_catalog.Catalog'
      produces:
      - application/json
      responses:
        "201":
          description: Created catalog object
          schema:
            $ref: '#/definitions/internal_domain_catalog.Catalog'
        "400":
          description: Invalid request body
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Could not create catalog
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: create catalog
      tags:
      - catalogs
  /api/catalogs/{id}:
    delete:
      description: Deletes a catalog entry by its ID. Only accessible by its creator
        or an admin.
      parameters:
      - description: Catalog ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid catalog ID
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Catalog not found
          schema:
            type: string
        "500":
          description: Delete failed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: delete catalog
      tags:
      - catalogs
    get:
      description: Retrieves a catalog by its ID. Only accessible by its creator or
        an admin.
      parameters:
      - description: Catalog ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Catalog object
          schema:
            $ref: '#/definitions/internal_domain_catalog.Catalog'
        "400":
          description: Invalid catalog ID
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Catalog not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: get catalog by ID
      tags:
      - catalogs
    put:
      consumes:
      - application/json
      description: Updates an existing catalog entry. Only accessible by its creator
        or an admin.
      parameters:
      - description: Catalog ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated catalog data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_catalog.Catalog'
      produces:
      - application/json
      responses:
        "200":
          description: Updated catalog object
          schema:
            $ref: '#/definitions/internal_domain_catalog.Catalog'
        "400":
          description: Bad request or invalid catalog ID
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Catalog not found
          schema:
            type: string
        "500":
          description: Update failed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: update catalog
      tags:
      - catalogs
  /api/orders:
    get:
      description: Retrieves all orders (admin only)
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_domain_cart.Order'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Retrieves all orders
      tags:
      - orders
    post:
      consumes:
      - multipart/form-data
      description: Places a new order
      parameters:
      - description: User ID
        in: formData
        name: user_id
        required: true
        type: integer
      - collectionFormat: csv
        description: Array of phone IDs
        in: formData
        items:
          type: integer
        name: phone_ids
        required: true
        type: array
      responses:
        "200":
          description: 'order ID: {id}'
          schema:
            type: string
        "400":
          description: Invalid user ID or phone ID
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Places a new order
      tags:
      - orders
  /api/orders/{id}:
    delete:
      description: Deletes an order (admin only)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid order ID
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Deletes an order
      tags:
      - orders
    get:
      description: Retrieves an order by ID (admin or order owner only)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_cart.Order'
        "400":
          description: Invalid order ID
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Order not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Retrieves an order by ID
      tags:
      - orders
    put:
      description: Updates an order (admin only)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Order data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_cart.Order'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_cart.Order'
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Updates an order
      tags:
      - orders
  /api/orders/me:
    get:
      description: Retrieves orders for the authenticated user
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_domain_cart.Order'
