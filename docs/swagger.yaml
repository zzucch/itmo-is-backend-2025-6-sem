host: localhost:3000
info:
  contact: {}
  title: Phone Marketplace API
  version: "1.0"
paths:
  /:
    get:
      description: Renders home page
      produces:
      - text/html
      responses:
        "200":
          description: HTML home page
        "500":
          description: Internal server error
      summary: Renders home page
      tags:
      - pages
  /api/phones:
    get:
      description: lists user's phones
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_is-web-y26_m3302-milovatskiy_internal_domain_general.Phone'
            type: array
      security:
      - BearerAuth: []
      summary: lists user's phones
      tags:
      - phones
    post:
      description: adds a new phone listing
      parameters:
      - description: Phone details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_is-web-y26_m3302-milovatskiy_internal_domain_general.Phone'
      responses:
        "201":
          description: Created
      security:
      - BearerAuth: []
      summary: adds a new phone listing
      tags:
      - phones
  /api/phones/{id}:
    delete:
      description: removes a phone listing
      parameters:
      - description: Phone ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: removes a phone listing
      tags:
      - phones
    get:
      description: gets phone listing by id
      parameters:
      - description: Phone ID
        in: path
        name: id
        required: true
        type: integer
      - description: Phone details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_is-web-y26_m3302-milovatskiy_internal_domain_general.Phone'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_is-web-y26_m3302-milovatskiy_internal_domain_general.Phone'
      security:
      - BearerAuth: []
      summary: gets phone listing by id
      tags:
      - phones
    put:
      description: modifies phone listing
      parameters:
      - description: Phone ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated phone details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_is-web-y26_m3302-milovatskiy_internal_domain_general.Phone'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_is-web-y26_m3302-milovatskiy_internal_domain_general.Phone'
      security:
      - BearerAuth: []
      summary: modifies phone listing
      tags:
      - phones
  /api/users:
    get:
      description: retrieves all users
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_domain_user.UserResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: retrieves all users
      tags:
      - users
    post:
      description: creates a new user account
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_user.CreateUserRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_domain_user.UserResponse'
      summary: creates a new user account
      tags:
      - users
  /api/users/{id}:
    delete:
      description: removes a user account
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: removes a user account
      tags:
      - users
    get:
      description: retrieves user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_user.UserResponse'
        "400":
          description: Invalid user ID
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: retrieves user by ID
      tags:
      - users
    put:
      description: updates user information
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_user.User'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_user.UserResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: updates user information
      tags:
      - users
  /api/users/login:
    post:
      description: authenticates user and returns token
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_user.LoginRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_user.LoginResponse'
      summary: authenticates user and returns token
      tags:
      - users
  /api/users/logout:
    post:
      description: ends user session
      responses: {}
      security:
      - BearerAuth: []
      summary: ends user session
      tags:
      - users
  /api/users/me:
    delete:
      description: removes the currently authenticated user
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: removes the currently authenticated user
      tags:
      - users/me
    get:
      description: returns logged-in user's profile
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_user.UserResponse'
      security:
      - BearerAuth: []
      summary: returns logged-in user's profile
      tags:
      - users/me
    put:
      description: modifies user profile
      parameters:
      - description: Update data
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_domain_user.UpdateUserRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_user.UpdateResponse'
      security:
      - BearerAuth: []
      summary: modifies user profile
      tags:
      - users/me
  /api/users/me/invalidate-tokens:
    post:
      description: Invalidates all active tokens for a user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: All tokens invalidated successfully
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Invalidate all user tokens
      tags:
      - users/me
  /api/users/me/tokens:
    get:
      description: Get all active tokens for a user
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_domain_user.Token'
            type: array
      security:
      - ApiKeyAuth: []
      summary: Get user tokens
      tags:
      - users/me
  /cart:
    get:
      description: Renders cart page
      produces:
      - text/html
      responses:
        "200":
          description: HTML cart page
        "500":
          description: Internal server error
      summary: Renders cart page
      tags:
      - pages
  /catalog:
    get:
      description: Renders catalog page
      produces:
      - text/html
      responses:
        "200":
          description: HTML catalog page
        "500":
          description: Internal server error
      summary: Renders catalog page
      tags:
      - pages
  /login:
    get:
      description: Renders login page
      produces:
      - text/html
      responses:
        "200":
          description: HTML login page
        "302":
          description: Redirect to home if already logged in
        "405":
          description: Method not allowed
        "500":
          description: Internal server error
      summary: Renders login page
      tags:
      - pages
  /orders:
    post:
      consumes:
      - multipart/form-data
      description: Places a new order
      parameters:
      - description: User ID
        in: formData
        name: user_id
        required: true
        type: integer
      - collectionFormat: csv
        description: Array of phone IDs
        in: formData
        items:
          type: integer
        name: phone_ids
        required: true
        type: array
      responses:
        "200":
          description: 'order ID: {id}'
          schema:
            type: string
        "400":
          description: Invalid user ID or phone ID
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Places a new order
      tags:
      - orders
  /signup:
    get:
      description: Renders signup page
      produces:
      - text/html
      responses:
        "200":
          description: HTML signup page
        "302":
          description: Redirect to home if already logged in
        "405":
          description: Method not allowed
        "500":
          description: Internal server error
      summary: Renders signup page
      tags:
      - pages
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: '"Bearer" followed by a space and the JWT token'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
