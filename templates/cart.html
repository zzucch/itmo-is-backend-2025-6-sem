{{ define "content" }}
<script src="/static/js/load_speed.js"></script>

<h2>Your Shopping Cart</h2>

<table border="1" width="100%">
    <thead>
        <tr>
            <th>Product</th>
            <th>Image</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="cart-items">
        <tr>
            <td colspan="5">Your cart is empty</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="3" align="right"><strong>Total:</strong></td>
            <td id="cart-total">$0</td>
            <td>
                <button type="button" onclick="checkout()">Checkout</button>
            </td>
        </tr>
    </tfoot>
</table>

<script>
    function displayCart(cartItems) {
        const cartTable = document.getElementById("cart-items");
        cartTable.innerHTML = "";

        if (!cartItems || cartItems.length === 0) {
            cartTable.innerHTML = '<tr><td colspan="4">Your cart is empty</td></tr>';
            document.getElementById("cart-total").textContent = "$0.00";
            return;
        }

        let total = 0;

        cartItems.forEach((item) => {
            const itemRow = document.createElement("tr");
            itemRow.className = "cart-item";

            const propertiesToShow = {
                Name: item.Name || "Unknown Item",
                Price: `$${(item.Price || 0).toFixed(2)}`,
                Image: item.Image ? `<img src="${item.Image.Path || item.Image.URL}" width="100">` : "No image"
            };

            for (const key in propertiesToShow) {
                const cell = document.createElement("td");
                cell.innerHTML = propertiesToShow[key];
                itemRow.appendChild(cell);
            }

            const actionCell = document.createElement("td");
            const removeBtn = document.createElement("button");
            removeBtn.textContent = "Remove";
            removeBtn.onclick = () => removeFromCart(item.ID);
            actionCell.appendChild(removeBtn);
            itemRow.appendChild(actionCell);

            cartTable.appendChild(itemRow);
            total += item.Price || 0;
        });

        document.getElementById("cart-total").textContent = `$${total.toFixed(2)}`;
    }

    function loadCart() {
        fetch('/api/users/me/cart')
            .then(response => {
                if (!response.ok) throw new Error(`error status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                displayCart(data);
            })
            .catch(error => {
                alert("Error loading cart:", error);
                document.getElementById("cart-items").innerHTML = `
        <tr>
          <td colspan="4" class="error-message">
            Error loading cart: ${error.message}
            <button onclick="loadCart()">Retry</button>
          </td>
        </tr>
      `;
            });
    }

    document.addEventListener("DOMContentLoaded", loadCart);
</script>

{{ end }}
