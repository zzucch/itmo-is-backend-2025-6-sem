{{ define "content" }}
<script type="module" src="/static/js/cart.js" defer></script>

<h2>Your Shopping Cart</h2>

<table border="1" width="100%">
    <thead>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Image</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="cart-items">
        <tr>
            <td colspan="4">Your cart is empty</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="3" align="right"><strong>Total:</strong></td>
            <td id="cart-total">$0</td>
            <td>
                <button type="button" onclick="checkout()">Checkout</button>
            </td>
        </tr>
    </tfoot>
</table>

<div id="order-modal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5); z-index:1000;">
    <div style="background-color:white; margin:100px auto; padding:20px; width:50%; border-radius:5px;">
        <h3>Confirm Your Order</h3>
        <div id="order-summary"></div>
        <div style="margin-top:20px;">
            <label for="shipping-address">Shipping Address:</label>
            <input type="text" id="shipping-address" style="width:100%; padding:8px; margin-bottom:10px;" required>
        </div>
        <div style="margin-top:10px; text-align:right;">
            <button onclick="document.getElementById('order-modal').style.display='none'">Cancel</button>
            <button onclick="confirmOrder()" style="margin-left:10px;">Place Order</button>
        </div>
    </div>
</div>

<h2 style="margin-top: 40px;">Your Order History</h2>
<div id="order-history">
    <p>Loading your orders...</p>
</div>

{{ end }}
