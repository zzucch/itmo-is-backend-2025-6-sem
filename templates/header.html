{{ define "header" }}
<header>
    <h1>The Phone Marketplace</h1>
    <nav>
        <ul>
            {{range .MenuLinks}}
            <li><a href="{{.URL}}">{{.Name}}</a></li>
            {{end}}

            {{if .IsAuthorized}}
            <li><a href="/signout">Sign out</a></li>
            {{else}}
            <li><a href="/login">Log in</a></li>
            <li><a href="/signup">Sign up</a></li>
            {{end}}
        </ul>
    </nav>
</header>
{{ end }}
